<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07080b">
<meta name="description" content="Dex's Pokecard Dex - a personal checklist for Pokemon TCG sets.">
<meta name="robots" content="noindex">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pokecard Dex">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='19' fill='%230b0d13'/%3E%3Cpath d='M20 1a19 19 0 0 1 19 19H1A19 19 0 0 1 20 1z' fill='%23f0334b'/%3E%3Cpath d='M1 20h38' stroke='%23262b39' stroke-width='2'/%3E%3Ccircle cx='20' cy='20' r='6.2' fill='%230b0d13' stroke='%23262b39' stroke-width='1.8'/%3E%3Ccircle cx='20' cy='20' r='2.5' fill='%23cfd6e6'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='19' fill='%230b0d13'/%3E%3Cpath d='M20 1a19 19 0 0 1 19 19H1A19 19 0 0 1 20 1z' fill='%23f0334b'/%3E%3Cpath d='M1 20h38' stroke='%23262b39' stroke-width='2'/%3E%3Ccircle cx='20' cy='20' r='6.2' fill='%230b0d13' stroke='%23262b39' stroke-width='1.8'/%3E%3Ccircle cx='20' cy='20' r='2.5' fill='%23cfd6e6'/%3E%3C/svg%3E">
<title>Dex's Pokecard Dex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
:root{
  --void:#07080b;--panel:#101219;--panel-2:#161923;--line:#212533;--line-soft:#1a1d27;
  --ink:#e9ebf2;--muted:#7e8598;--dim:#5b6274;--crimson:#f0334b;--jade:#35c88b;--gold:#e3b341;
  --foil:#8fb0ff;--plume:#cfd6e6;--r:10px;
  color-scheme:dark;
}
*{box-sizing:border-box}
button,a,.tick,.tile,.shot{-webkit-tap-highlight-color:transparent}
body{
  margin:0;
  background:
    radial-gradient(1100px 620px at 78% -8%, #16111c 0%, rgba(22,17,28,0) 62%),
    radial-gradient(760px 420px at 6% 4%, #0c1019 0%, rgba(12,16,25,0) 58%),
    var(--void);
  background-attachment:fixed;color:var(--ink);
  font-family:"Archivo","Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1120px;margin:0 auto;padding-inline:20px;padding-block:26px 72px}

.mast{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:13px;min-width:0}
.orb{width:38px;height:38px;flex:0 0 auto}
h1{font-family:"Chakra Petch",sans-serif;font-weight:700;font-size:clamp(25px,4.4vw,36px);line-height:1;margin:0;letter-spacing:-.015em;text-wrap:balance}
h1 .apo{color:var(--crimson)}
.tagline{margin:7px 0 0;color:var(--muted);font-size:13px;letter-spacing:.02em}
.saved{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);display:flex;align-items:center;gap:7px;padding-bottom:4px}
.saved .dot{width:6px;height:6px;border-radius:50%;background:var(--dim);transition:background .25s}
.saved.on .dot{background:var(--jade);box-shadow:0 0 9px rgba(53,200,139,.75)}
.saved.warn .dot{background:var(--gold)}

/* shelf */
.shelfhead{display:flex;align-items:baseline;gap:14px;margin:34px 0 14px}
.shelfhead h2{font-family:"Chakra Petch",sans-serif;font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--plume);margin:0}
.shelfhead .rule{flex:1;height:1px;background:var(--line)}
.shelfhead .tot{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:9px}

.tile{
  position:relative;overflow:hidden;cursor:pointer;text-align:left;color:inherit;font:inherit;
  background:linear-gradient(118deg,color-mix(in srgb,var(--ac) 24%,var(--panel)) 0%,var(--panel) 62%);
  border:1px solid var(--line-soft);border-top:3px solid var(--ac);
  border-radius:5px;padding:13px 14px 12px;display:grid;gap:10px;align-content:start;
  transition:border-color .16s,transform .1s;
}
.tile::after{
  content:"";position:absolute;right:-28px;top:-44px;width:118px;height:118px;border-radius:50%;
  background:var(--ac);opacity:.09;pointer-events:none;
}
.tile:hover{border-color:color-mix(in srgb,var(--ac) 45%,var(--line))}
.tile:active{transform:scale(.995)}
.tile > *{position:relative}
.tile .top{display:flex;align-items:baseline;justify-content:space-between;gap:9px}
.tile h3{
  font-family:"Chakra Petch",sans-serif;font-size:15.5px;margin:0;font-weight:600;line-height:1.2;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  overflow-wrap:anywhere;
}
.tile .code{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.14em;color:var(--ac);flex:0 0 auto}
.tile .track{height:3px;border-radius:2px;background:#0a0c12;overflow:hidden}
.tile .track i{display:block;height:100%;background:var(--ac);transition:width .35s ease}
.tile .n{
  font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);
  display:flex;justify-content:space-between;gap:8px;font-variant-numeric:tabular-nums;
}
.tile .n b{color:var(--plume);font-weight:600}
.tile .n .pct{color:var(--ac);font-weight:600}
.tile.done{border-color:#1e4634}
.tile.done .n .pct::after{content:" \2713"}

/* detail */
.back{display:inline-flex;align-items:center;gap:8px;background:none;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:7px 14px;cursor:pointer;margin:30px 0 16px}
.back:hover{color:var(--plume);border-color:#39405280}
.setbar{
  background:
    radial-gradient(520px 220px at 104% -40%, color-mix(in srgb, var(--ac) 18%, transparent) 0%, rgba(0,0,0,0) 70%),
    linear-gradient(180deg,var(--panel) 0%,var(--panel-2) 100%);
  border:1px solid var(--line);border-top:2px solid var(--ac);border-radius:16px;padding:22px;
  display:grid;grid-template-columns:minmax(0,1fr) auto;gap:22px;align-items:center;
}
.setmeta h2{font-family:"Chakra Petch",sans-serif;font-weight:700;font-size:22px;margin:0;letter-spacing:.01em}
.setmeta .sub{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted);margin-top:6px;display:flex;gap:14px;flex-wrap:wrap}
.setmeta .sub span{white-space:nowrap}
.counter{text-align:right}
.counter .big{font-family:"Chakra Petch",sans-serif;font-weight:700;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.counter .big em{font-style:normal;color:var(--dim);font-size:19px}
.counter .lab{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.meter{grid-column:1/-1;height:5px;border-radius:3px;background:#0b0d13;overflow:hidden;border:1px solid var(--line-soft)}
.meter i{display:block;height:100%;width:0;background:var(--ac);transition:width .35s ease}
.splits{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.split{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 11px;background:#0c0e15;font-variant-numeric:tabular-nums}
.split b{color:var(--plume);font-weight:600}
.split.foil{border-color:#2b3550}
.split.foil b{color:var(--foil)}

/* toolbar */
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:20px 0 10px}
.search{position:relative;flex:1 1 220px;min-width:0}
.search input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);color:var(--ink);font-family:inherit;font-size:14px;padding:9px 12px 9px 34px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--dim)}
.search input::placeholder{color:var(--dim)}
select{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);color:var(--ink);font-family:inherit;font-size:13.5px;padding:9px 11px;cursor:pointer}
.toggle{display:inline-flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:9px 13px;cursor:pointer;font-size:13.5px;color:var(--muted);user-select:none}
.toggle input{accent-color:var(--ac);margin:0;width:14px;height:14px}
.toggle:has(input:checked){color:var(--ink);border-color:color-mix(in srgb, var(--ac) 35%, var(--line))}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}

.legend{
  display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin:0 0 6px;
  font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--dim);letter-spacing:.04em;
}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:13px;height:13px;border-radius:4px;border:1.5px solid #2c3141;background:#0b0d13;display:inline-block}
.legend i.n{background:var(--jade);border-color:var(--jade)}
.legend i.r{background:linear-gradient(135deg,#cfe0ff 0%,var(--foil) 45%,#6f8fe0 100%);border-color:var(--foil)}

/* cards */
.group{margin-top:24px}
.grouphead{display:flex;align-items:baseline;gap:12px;margin-bottom:12px}
.grouphead h3{font-family:"Chakra Petch",sans-serif;font-size:13px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--plume);margin:0}
.grouphead .rule{flex:1;height:1px;background:var(--line)}
.grouphead .cnt{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(296px,1fr));gap:8px}
.card{
  display:grid;grid-template-columns:auto auto 1fr auto;align-items:center;gap:10px;
  background:var(--panel);border:1px solid var(--line-soft);border-left:3px solid var(--type,#2a2f3d);
  border-radius:var(--r);padding:9px 10px 9px 12px;
  transition:border-color .16s,background .16s;
}
.card:hover{background:var(--panel-2);border-color:var(--line)}
.card.part{background:#0b1219;border-color:#243040}
.card.got{background:#0d1712;border-color:#1e4634;border-left-color:var(--jade)}
.card.got:hover{background:#0f1c16}
.card.got .name{color:#d8f5e8}
.num{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums;width:30px}

/* card thumbnails */
.shot{
  width:40px;height:56px;flex:0 0 auto;border-radius:3px;overflow:hidden;position:relative;
  background:#0a0c11;border:1px solid var(--line-soft);display:block;padding:0;cursor:zoom-in;
}
.shot img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .25s}
.shot img.in{opacity:1}
.shot.none{cursor:default;display:grid;place-items:center}
.shot.none::after{
  content:"\003F";font-family:"IBM Plex Mono",monospace;font-size:12px;color:#333a4a;
}
.shot:not(.none):hover{border-color:#3d4457}
.card.got .shot{border-color:#1e4634}
body.noimg .shot{display:none}
body.noimg .card{grid-template-columns:auto 1fr auto}

.lens{
  position:fixed;inset:0;z-index:60;background:rgba(4,5,8,.86);backdrop-filter:blur(3px);
  display:grid;place-items:center;padding:24px;
}
.lens[hidden]{display:none}
.lens figure{margin:0;display:grid;justify-items:center;gap:12px;max-height:100%}
.lens img{
  max-width:min(92vw,420px);max-height:calc(100vh - 130px);width:auto;height:auto;
  border-radius:12px;box-shadow:0 26px 70px rgba(0,0,0,.72);
}
.lens figcaption{text-align:center;max-width:420px}
.lens .t{font-family:"Chakra Petch",sans-serif;font-size:17px;font-weight:600}
.lens .s{font-family:"IBM Plex Mono",monospace;font-size:11.5px;letter-spacing:.07em;color:var(--muted);margin-top:4px}
.lens .x{
  position:absolute;top:16px;right:18px;width:36px;height:36px;border-radius:9px;
  border:1px solid var(--line);background:var(--panel);color:var(--plume);cursor:pointer;
  font-size:19px;line-height:1;display:grid;place-items:center;
}
.lens .x:hover{background:var(--panel-2)}
.body{min-width:0}
.name{font-size:14.5px;font-weight:500;line-height:1.25;overflow-wrap:anywhere}
.rar{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.06em;color:var(--muted);margin-top:3px;display:block}
.rar.hi{color:var(--gold)}
.ticks{display:flex;gap:5px;flex:0 0 auto}
.tick{
  width:24px;height:24px;border-radius:6px;border:1.5px solid #2c3141;background:#0b0d13;
  display:grid;place-items:center;cursor:pointer;padding:0;transition:all .16s;position:relative;
}
.tick:hover{border-color:#3d4457}
.tick svg{width:13px;height:13px;opacity:0;transform:scale(.5);transition:all .18s;color:#04140d}
.tick.on{background:var(--jade);border-color:var(--jade);box-shadow:0 0 12px rgba(53,200,139,.32)}
.tick.on svg{opacity:1;transform:scale(1)}
.tick.rh::after{
  content:"";position:absolute;inset:3px;border-radius:3px;
  background:linear-gradient(135deg,rgba(143,176,255,.22) 0%,rgba(143,176,255,0) 55%);
}
.tick.rh.on{background:linear-gradient(135deg,#dbe7ff 0%,var(--foil) 48%,#6f8fe0 100%);border-color:var(--foil);box-shadow:0 0 12px rgba(143,176,255,.35)}
.tick.rh.on::after{background:linear-gradient(135deg,rgba(255,255,255,.55) 0%,rgba(255,255,255,0) 50%)}
.tick.rh.on svg{color:#0b1430}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:34px;text-align:center;color:var(--muted);font-size:14px}

footer{margin-top:44px;padding-top:18px;border-top:1px solid var(--line-soft);display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--dim);letter-spacing:.04em}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.reset{background:none;border:1px solid var(--line);border-radius:7px;color:var(--muted);font-family:inherit;font-size:11px;letter-spacing:.06em;padding:5px 11px;cursor:pointer}
.reset:hover{color:var(--crimson);border-color:#3a2030}
.act:hover{color:var(--jade);border-color:#1e4634}
.act.ok{color:#04140d;background:var(--jade);border-color:var(--jade)}
.linkbox{flex:1 1 100%;margin-top:10px;background:var(--panel);border:1px solid var(--line);border-radius:7px;color:var(--plume);font-family:inherit;font-size:11px;padding:8px 10px}

/* the sticky bar above a set: back out, and always see where you are */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.peek{display:none;font-family:"IBM Plex Mono",monospace;font-size:13px;font-variant-numeric:tabular-nums;color:var(--plume)}
.peek b{font-weight:600;color:var(--ac)}
.peek em{font-style:normal;color:var(--dim)}

@media (max-width:620px){
  body{font-size:14.5px}
  .wrap{padding-inline:14px;padding-block:18px 54px}
  .orb{width:31px;height:31px}
  .brand{gap:10px}
  .mast{align-items:center;gap:10px}
  .tagline{font-size:12px;margin-top:5px}
  .saved{padding-bottom:0;font-size:10px}
  .shelfhead{margin:24px 0 11px}

  .topbar{
    position:sticky;top:0;z-index:20;margin:0 -14px;padding:9px 14px 8px;
    background:color-mix(in srgb,var(--void) 88%,transparent);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line-soft);
  }
  .back{margin:0;padding:6px 12px}
  .peek{display:block}

  .shelfhead .tot{font-size:10.5px}

  /* the running total already sits in the sticky bar, so the big
     counter comes out and the set line gets the full width */
  .setbar{grid-template-columns:1fr;gap:13px;padding:15px 16px;border-radius:13px;margin-top:14px}
  .setbar > *{min-width:0}
  .setmeta h2{font-size:18.5px;line-height:1.2}
  .setmeta .sub{font-size:11px;gap:4px 12px;margin-top:6px}
  .setmeta .sub span{white-space:normal}
  .counter{display:none}

  /* chips on one swipeable line instead of eight stacked rows */
  .splits{
    flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;
    margin:0 -16px;padding:1px 16px;scroll-snap-type:x proximity;
    -webkit-mask-image:linear-gradient(90deg,#000 0,#000 90%,transparent 100%);
            mask-image:linear-gradient(90deg,#000 0,#000 90%,transparent 100%);
  }
  .splits::-webkit-scrollbar{display:none}
  .split{flex:0 0 auto;scroll-snap-align:start;font-size:11px;padding:4px 10px}

  /* two neat columns of controls */
  .tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 9px}
  .search{grid-column:1/-1}
  select,.toggle{width:100%;font-size:13px;padding:9px 10px}
  .toggle{gap:7px}
  .legend{font-size:10.5px;gap:13px}

  .grid{grid-template-columns:1fr;gap:7px}
  .card{gap:9px;padding:8px 9px 8px 11px}
  .num{font-size:11px;width:27px}
  .name{font-size:14px}
  .rar{font-size:10px}
  .shot{width:38px;height:53px}
  .ticks{gap:7px}
  .tick{width:32px;height:32px;border-radius:9px}
  .tick svg{width:16px;height:16px}
  .peek{cursor:pointer}
  .group{margin-top:20px}

  .shelf{grid-template-columns:1fr 1fr;gap:8px}
  .tile{padding:11px 12px 10px}
  .tile h3{font-size:14px}
  .tile .n{font-size:10.5px}
  .tile .code{font-size:9px}

  .lens{padding:14px}
  .lens img{max-width:88vw;max-height:calc(100vh - 150px)}
  .lens .x{top:10px;right:12px}
  footer{margin-top:32px;gap:10px}
}
@media (max-width:360px){ .tools{grid-template-columns:1fr} }
@media (max-width:330px){ .shelf{grid-template-columns:1fr} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <header class="mast">
    <div class="brand">
      <svg class="orb" viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="20" r="18.5" fill="#0b0d13" stroke="#262b39"/>
        <path d="M1.5 20h37" stroke="#262b39" stroke-width="1.6"/>
        <path d="M20 1.5a18.5 18.5 0 0 1 18.5 18.5H1.5A18.5 18.5 0 0 1 20 1.5z" fill="#f0334b" opacity=".9"/>
        <circle cx="20" cy="20" r="6" fill="#0b0d13" stroke="#262b39" stroke-width="1.6"/>
        <circle cx="20" cy="20" r="2.4" fill="#cfd6e6"/>
      </svg>
      <div>
        <h1>Dex<span class="apo">&#39;</span>s Pokecard Dex</h1>
        <p class="tagline">Tick off what&#39;s in the binder. Everything else is still out there.</p>
      </div>
    </div>
    <div class="saved" id="saved"><span class="dot"></span><span id="savedText">loading</span></div>
  </header>

  <div id="shelfView">
    <div class="shelfhead"><h2>Your sets</h2><span class="rule"></span><span class="tot" id="grandTotal"></span></div>
    <div class="shelf" id="shelf"></div>
  </div>

  <div id="setView" hidden>
    <div class="topbar">
      <button class="back" type="button" id="back">&#8592; All sets</button>
      <span class="peek" id="peek"><b id="peekN">0</b><em id="peekT">/0</em></span>
    </div>

    <section class="setbar" id="setbar">
      <div class="setmeta">
        <h2 id="setName"></h2>
        <div class="sub" id="setSub"></div>
      </div>
      <div class="counter">
        <div class="big"><span id="ownedN">0</span><em id="ownedT">/0</em></div>
        <div class="lab" id="ownedLab">collected</div>
      </div>
      <div class="meter"><i id="meterFill"></i></div>
      <div class="splits" id="splits"></div>
    </section>

    <div class="tools">
      <label class="search">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
          <circle cx="7" cy="7" r="4.6"/><path d="M10.4 10.4 14 14"/>
        </svg>
        <input id="q" type="search" placeholder="Search a card by name or number" aria-label="Search cards">

   images.pokemontcg.io (…/<id>.png, _hires.png). A card outside every
   segment, or one whose picture is not published yet, shows a blank slug. */
function art(s, c, big){
  const segs = s.img || [];
  for (let i = 0; i < segs.length; i++){
    const [a, b, host, path, pad] = segs[i];
    if (c.ix < a || c.ix > b) continue;
    let id = c.label;
    if (host === "t" && pad && /^\d+$/.test(id)) id = String(id).padStart(pad, "0");
    return host === "t"
      ? "https://assets.tcgdex.net/en/" + path + "/" + id + (big ? "/high.png" : "/low.png")
      : "https://images.pokemontcg.io/" + path + "/" + id + (big ? "_hires.png" : ".png");
  }
  return null;
}

/* ---------- share code: two base-36 masks per set ---------- */
function maskOf(s, rh){
  let v = 0n;
  const m = owned[s.key] || {};
  s.list.forEach(c => {
    if (rh && !c.rh) return;
    if (m[slotKey(c.n, rh)]) v |= 1n << BigInt(c.n - 1);
  });
  return v ? v.toString(36) : "0";
}
function unmask(code, s, rh, into){
  let v = 0n;
  for (const ch of String(code).toLowerCase()){
    const d = D36.indexOf(ch);
    if (d < 0) return false;
    v = v * 36n + BigInt(d);
  }
  s.list.forEach(c => {
    if (rh && !c.rh) return;
    if ((v >> BigInt(c.n - 1)) & 1n) into[slotKey(c.n, rh)] = true;
  });
  return true;
}
function encodeAll(){
  const parts = SETS.map(s => maskOf(s, false) + "." + maskOf(s, true));
  return parts.every(p => p === "0.0") ? "" : parts.join("-");
}
function decodeAll(code){
  const parts = String(code).split("-");
  const out = {};
  let any = false;
  SETS.forEach((s, i) => {
    const m = {};
    const pair = (parts[i] || "").split(".");
    if (pair[0]) unmask(pair[0], s, false, m);
    if (pair[1]) unmask(pair[1], s, true, m);
    out[s.key] = m;
    if (Object.keys(m).length) any = true;
  });
  return any ? out : null;
}

/* ---------- shelf ---------- */
function buildShelf(){
  const shelf = el("shelf");
  shelf.textContent = "";
  SETS.forEach((s, i) => {
    if (s.hidden) return;
    const got = countOf(s), pct = Math.round(got / s.master * 100);
    const t = document.createElement("button");
    t.type = "button";
    t.className = "tile";
    t.style.setProperty("--ac", s.accent);
    t.innerHTML =
      '<div class="top"><h3></h3><span class="code"></span></div>' +
      '<div class="track"><i></i></div>' +
      '<div class="n"><span><b></b> / ' + s.master + '</span><span class="pct"></span></div>';
    t.querySelector("h3").textContent = s.tab;
    t.querySelector(".code").textContent = s.code;
    t.querySelector(".track i").style.width = pct + "%";
    t.querySelector(".n b").textContent = got;
    t.querySelector(".pct").textContent = pct + "%";
    t.classList.toggle("done", got === s.master && s.master > 0);
    t.title = s.name + " \u2014 " + got + " / " + s.master;
    t.setAttribute("aria-label", s.tab + ", " + got + " van " + s.master + " verzameld");
    t.addEventListener("click", () => openSet(i));
    shelf.append(t);
  });
  const shelved = SETS.filter(s => !s.hidden);
  const got = shelved.reduce((a, s) => a + countOf(s), 0);
  const tot = shelved.reduce((a, s) => a + s.master, 0);
  el("grandTotal").textContent = got + " of " + tot + " cards collected";
}

/* ---------- set view ---------- */
function openSet(i){
  active = i;
  const s = S();
  el("shelfView").hidden = true;
  el("setView").hidden = false;
  el("reset").hidden = false;
  el("setView").style.setProperty("--ac", s.accent);
  el("setbar").style.setProperty("--ac", s.accent);
  el("q").value = "";
  el("missingOnly").checked = false;
  el("slot").value = "all";
  el("slot").hidden = !s.rhCount;
  el("legend").hidden = !s.rhCount;

  el("setName").textContent = s.name;
  const sub = el("setSub");
  sub.textContent = "";
  [s.code, s.note || (s.total + " cards")]
    .concat(s.groups ? [s.groups.length + " sections"] : [])
    .concat(s.rhCount ? [s.rhCount + " reverse holos", s.master + " in a master set"] : [])
    .concat(s.printed === s.total || !s.rhCount ? [] : [])
    .concat(["released " + s.released])
    .forEach(t => { const x = document.createElement("span"); x.textContent = t; sub.append(x); });
  el("ownedT").textContent = "/" + s.master;
  el("peekT").textContent = "/" + s.master;
  el("ownedLab").textContent = s.rhCount ? "of the master set" : "collected";
  el("foot").textContent = "Card data: " + s.name;

  const sel = el("rarity");
  sel.textContent = "";
  const all = document.createElement("option");
  all.value = ""; all.textContent = "All rarities";
  sel.append(all);
  const tally = {};
  s.list.forEach(c => tally[c.rarity] = (tally[c.rarity] || 0) + 1);
  Object.keys(tally).sort((a, b) => tally[b] - tally[a]).forEach(r => {
    const o = document.createElement("option");
    o.value = r; o.textContent = r;
    sel.append(o);
  });

  render();
  window.scrollTo(0, 0);
}

function showShelf(){
  active = null;
  el("setView").hidden = true;
  el("shelfView").hidden = false;
  el("reset").hidden = true;
  el("foot").textContent = "Card data: Pokémon TCG API · pictures: TCGdex";
  buildShelf();
  window.scrollTo(0, 0);
}

function tickNode(c, rh){
  const map = own();
  const b = document.createElement("button");
  b.type = "button";
  b.className = "tick" + (rh ? " rh" : "") + (map[slotKey(c.n, rh)] ? " on" : "");
  b.dataset.slot = slotKey(c.n, rh);
  b.innerHTML = CHECK;
  const what = rh ? "reverse holo" : "normal";
  b.title = c.name + " — " + what;
  b.setAttribute("aria-label", c.name + ", " + what);
  b.setAttribute("aria-pressed", map[slotKey(c.n, rh)] ? "true" : "false");
  b.addEventListener("click", () => toggle(c, rh));
  return b;
}

/* Hang the artwork in a row. The picture loads only when the row scrolls
   into view, and a card whose picture is missing keeps the blank slug. */
function fillShot(box, c){
  if (document.body.classList.contains("noimg")) return;
  const src = art(S(), c, false);
  if (!src) return;
  const im = document.createElement("img");
  im.loading = "lazy";
  im.decoding = "async";
  im.alt = "";
  im.src = src;
  im.addEventListener("load", () => { box.classList.remove("none"); im.classList.add("in"); });
  im.addEventListener("error", () => im.remove());
  box.append(im);
  box.classList.add("has");
  box.addEventListener("click", () => { if (box.classList.contains("has") && !box.classList.contains("none")) lens(c); });
}

function lens(c){
  const s = S();
  const box = el("lens");
  const im = el("lensImg");
  im.src = art(s, c, true) || art(s, c, false);
  im.alt = c.name;
  el("lensName").textContent = c.name;
  el("lensSub").textContent = shown(c.label) + " · " + c.rarity + " · " + s.tab;
  box.hidden = false;
  el("lensX").focus();
}

function closeLens(){
  el("lens").hidden = true;
  el("lensImg").removeAttribute("src");
}

function cardNode(c){
  const mode = el("slot").value;
  const row = document.createElement("div");
  row.className = "card";
  row.style.setProperty("--type", TYPE_COLOR[c.kind] || "#2a2f3d");
  row.dataset.n = c.n;
  row.innerHTML =
    '<span class="shot none"></span>' +
    '<span class="num">' + shown(c.label) + '</span>' +
    '<span class="body"><span class="name"></span><span class="rar' + (HI.has(c.rarity) ? " hi" : "") + '"></span></span>' +
    '<span class="ticks"></span>';
  row.querySelector(".name").textContent = c.name;
  row.querySelector(".rar").textContent = c.rarity + (c.kind && c.supertype !== "Pokémon" ? " · " + c.kind : "");
  fillShot(row.querySelector(".shot"), c);
  const ticks = row.querySelector(".ticks");
  if (mode !== "rh") ticks.append(tickNode(c, false));
  if (c.rh && mode !== "normal") ticks.append(tickNode(c, true));
  paintRow(row, c);
  return row;
}

function slotsOf(c){
  const mode = el("slot").value;
  const out = [];
  if (mode !== "rh") out.push(false);
  if (c.rh && mode !== "normal") out.push(true);
  return out;
}

function paintRow(row, c){
  const map = own();
  const slots = slotsOf(c);
  const got = slots.filter(rh => map[slotKey(c.n, rh)]).length;
  row.classList.toggle("got", slots.length > 0 && got === slots.length);
  row.classList.toggle("part", got > 0 && got < slots.length);
}

function render(){
  if (active === null) return;
  const s = S(), map = own(), L = el("list");
  const q = el("q").value.trim().toLowerCase();
  const rar = el("rarity").value;
  const missing = el("missingOnly").checked;
  const mode = el("slot").value;

  const visible = s.list.filter(c => {
    if (mode === "rh" && !c.rh) return false;
    if (q && !(c.name.toLowerCase().includes(q) || c.label.toLowerCase() === q || String(c.base) === q)) return false;
    if (rar && c.rarity !== rar) return false;
    if (missing && slotsOf(c).every(rh => map[slotKey(c.n, rh)])) return false;
    return true;
  });

  const shown_ = fn => visible.filter(fn);

  L.textContent = "";
  if (!visible.length){
    const e = document.createElement("div");
    e.className = "empty";
    e.textContent = missing ? "Nothing missing here — that’s the whole filter, collected." : "No card matches that.";
    L.append(e);
  } else {
    const span = list => list.length
      ? shown(list[0].label) + "–" + shown(list[list.length - 1].label) : "";
    const sections = s.groups
      ? s.groups.map(([title, from, to]) =>
          [title, span(s.list.filter(c => c.n >= from && c.n <= to)),
           shown_(c => c.n >= from && c.n <= to)])
      : [
          [s.printed === s.total ? "The full set" : "The numbered set",
           span(s.list.filter(c => c.base <= s.printed)), shown_(c => c.base <= s.printed)],
          ["Beyond the numbered set",
           span(s.list.filter(c => c.base > s.printed)), shown_(c => c.base > s.printed)]
        ];
    sections.forEach(([title, range, items]) => {
      if (!items.length) return;
      const sec = document.createElement("section");
      sec.className = "group";
      const head = document.createElement("div");
      head.className = "grouphead";
      head.innerHTML = '<h3></h3><span class="rule"></span><span class="cnt"></span>';
      head.querySelector("h3").textContent = title;
      head.querySelector(".cnt").dataset.range = range;
      const grid = document.createElement("div");
      grid.className = "grid";
      items.forEach(c => grid.append(cardNode(c)));
      sec.append(head, grid);
      L.append(sec);
    });
  }
  stats();
}

function stats(){
  if (active === null) return;
  const s = S(), map = own(), L = el("list");

  L.querySelectorAll(".group").forEach(sec => {
    const ticks = sec.querySelectorAll(".tick");
    const on = sec.querySelectorAll(".tick.on");
    const cnt = sec.querySelector(".cnt");
    cnt.textContent = on.length + " / " + ticks.length + "  ·  " + cnt.dataset.range;
  });

  let got = 0;
  for (const k in map) if (map[k]) got++;
  el("ownedN").textContent = got;
  el("peekN").textContent = got;
  el("meterFill").style.width = (got / s.master * 100) + "%";

  const base = s.list.filter(c => map[c.n]).length;
  const rhGot = s.list.filter(c => c.rh && map[c.n + "r"]).length;
  const main = s.list.filter(c => c.base <= s.printed), secret = s.list.filter(c => c.base > s.printed);

  const parts = [];
  if (s.rhCount) parts.push(["Base set", base, s.total], ["Reverse holos", rhGot, s.rhCount, true]);
  if (s.groups){
    s.groups.forEach(([title, from, to]) => {
      const g = s.list.filter(c => c.n >= from && c.n <= to);
      if (g.length) parts.push([title, g.filter(c => map[c.n]).length, g.length]);
    });
  } else if (secret.length){
    parts.push(["Numbered set", main.filter(c => map[c.n]).length, main.length],
               ["Beyond the set", secret.filter(c => map[c.n]).length, secret.length]);
  }
  CHIP_RARITIES.forEach(r => {
    const g = s.list.filter(c => c.rarity === r);
    if (g.length) parts.push([r, g.filter(c => map[c.n]).length, g.length]);
  });

  const box = el("splits");
  box.textContent = "";
  parts.forEach(([label, n, tot, foil]) => {
    const d = document.createElement("span");
    d.className = "split" + (foil ? " foil" : "");
    d.innerHTML = '<b></b> <span></span>';
    d.querySelector("b").textContent = n + "/" + tot;
    d.querySelector("span").textContent = label;
    box.append(d);
  });
}

/* ---------- state ---------- */
let backend = "local";        // local | claude | firebase
let remoteDoc = null;         // handle for whichever backend is live
let pushTimer = null;
let syncedOnce = false;
let applyingRemote = false;
let watchdog = null;

/* if the first snapshot never arrives, say so instead of spinning forever */
function armWatchdog(){
  clearTimeout(watchdog);
  watchdog = setTimeout(() => {
    if (!syncedOnce) status("warn", "offline — saved on this device");
  }, 8000);
}
function disarmWatchdog(){ clearTimeout(watchdog); watchdog = null; }

function toggle(c, rh){
  const map = own(), key = slotKey(c.n, rh);
  if (map[key]) delete map[key]; else map[key] = true;

  const row = el("list").querySelector('.card[data-n="' + c.n + '"]');
  if (row){
    const btn = row.querySelector('.tick[data-slot="' + key + '"]');
    if (btn){
      btn.classList.toggle("on", !!map[key]);
      btn.setAttribute("aria-pressed", map[key] ? "true" : "false");
    }
    paintRow(row, c);
    if (el("missingOnly").checked && row.classList.contains("got")) { render(); save(); return; }
  }
  stats();
  save();
}

function status(state, text){
  el("saved").className = "saved" + (state ? " " + state : "");
  el("savedText").textContent = text;
}
const grandTotal = () => SETS.filter(s => !s.hidden).reduce((a, s) => a + countOf(s), 0);

function localSave(){
  try { localStorage.setItem(LS, JSON.stringify(owned)); } catch(e){}
}

function save(){
  if (applyingRemote) return;
  localSave();

  if (remoteDoc){
    clearTimeout(pushTimer);
    pushTimer = setTimeout(push, 400);
    status("on", "saving…");
    return;
  }

  clearTimeout(pushTimer);
  pushTimer = setTimeout(() => {
    const code = encodeAll();
    try { history.replaceState(null, "", code ? "#c=" + code : location.pathname + location.search); } catch(e){}
  }, 300);
  const n = grandTotal();
  status(n ? "on" : "warn", n ? "saved in this browser" : "nothing ticked yet");
}

/* ---------- sync plumbing ---------- */
function cleanOwned(raw){
  const out = {};
  SETS.forEach(s => {
    const src = (raw && raw[s.key]) || {};
    const m = {};
    s.list.forEach(c => {
      if (src[c.n]) m[c.n] = true;
      if (c.rh && src[c.n + "r"]) m[c.n + "r"] = true;
    });
    out[s.key] = m;
  });
  return out;
}

function unionInto(a, b){        // b wins nothing; every tick from either side is kept
  SETS.forEach(s => {
    const t = a[s.key] = a[s.key] || {};
    const o = (b && b[s.key]) || {};
    for (const k in o) if (o[k]) t[k] = true;
  });
  return a;
}

function repaint(){
  buildShelf();
  if (active !== null) render();
}

function adopt(raw){
  applyingRemote = true;
  owned = cleanOwned(raw);
  localSave();
  repaint();
  applyingRemote = false;
}

async function push(){
  if (!remoteDoc) return;
  try {
    await remoteDoc.write({ owned, updatedAt: Date.now() });
    status("on", backend === "local" ? "saved in this browser" : "synced");
  } catch (e){
    status("warn", "offline — saved on this device");
  }
}

function onRemote(data){
  disarmWatchdog();
  const remote = data && data.owned;
  const localHas = grandTotal() > 0;

  if (!remote){                       // nothing stored yet — seed it from this device
    syncedOnce = true;
    if (localHas) push(); else status("on", "synced");
    return;
  }
  if (!syncedOnce && localHas){       // first contact with ticks on both sides — keep them all
    syncedOnce = true;
    adopt(unionInto(cleanOwned(owned), remote));
    push();
    return;
  }
  syncedOnce = true;
  adopt(remote);
  status("on", "synced");
}

function syncId(){
  if (SYNC_ID && SYNC_ID.length >= 12) return SYNC_ID;
  const m = location.hash.match(/s=([A-Za-z0-9_-]{8,})/);
  let id = m ? m[1] : null;
  if (!id){ try { id = localStorage.getItem(SYNC_LS); } catch(e){} }
  if (!id){
    const a = new Uint8Array(12);
    (self.crypto || {}).getRandomValues ? crypto.getRandomValues(a) : a.forEach((_, i) => a[i] = Math.random() * 256);
    id = Array.from(a, x => "abcdefghijklmnopqrstuvwxyz0123456789"[x % 36]).join("");
  }
  try { localStorage.setItem(SYNC_LS, id); } catch(e){}
  return id;
}

function syncUrl(){
  if (SYNC_ID) return location.origin + location.pathname;
  let id = null;
  try { id = localStorage.getItem(SYNC_LS); } catch(e){}
  return location.origin + location.pathname + (id ? "#s=" + id : "");
}

async function connect(){
  /* 1 — published on claude.ai: use the artifact's own store */
  try {
    const db = await (window.claude && window.claude.use ? window.claude.use("db") : null);
    if (db){
      backend = "claude";
      const ref = db.doc("collections/master-v3");
      remoteDoc = { write: body => ref.set(body) };
      ref.onSnapshot(
        snap => onRemote(snap.exists ? snap.data() : null),
        () => { remoteDoc = null; status("warn", "offline — saved on this device"); }
      );
      status("on", "syncing…");
      armWatchdog();
      return;
    }
  } catch(e){ /* not on claude.ai */ }

  /* 2 — self-hosted with Firebase configured: sync through Firestore */
  if (FIREBASE.projectId){
    try {
      const [{ initializeApp }, fs] = await Promise.all([
        import(FB_SDK + "firebase-app.js"),
        import(FB_SDK + "firebase-firestore.js")
      ]);
      const app = initializeApp(FIREBASE);
      const store = fs.getFirestore(app);
      const id = syncId();
      const ref = fs.doc(store, "dexes", id);

      backend = "firebase";
      remoteDoc = { write: body => fs.setDoc(ref, body) };
      if (!SYNC_ID && !location.hash.startsWith("#s=")){
        try { history.replaceState(null, "", "#s=" + id); } catch(e){}
      }
      el("share").textContent = SYNC_ID ? "Copy link to this Dex" : "Copy sync link";
      fs.onSnapshot(ref,
        snap => onRemote(snap.exists() ? snap.data() : null),
        () => { status("warn", "offline — saved on this device"); }
      );
      status("on", "syncing…");
      armWatchdog();
      return;
    } catch (e){
      status("warn", "sync unavailable — saved on this device");
      return;
    }
  }

  /* 3 — no backend: this browser plus the share link */
  const n = grandTotal();
  status(n ? "on" : "warn", n ? "saved in this browser" : "nothing ticked yet");
}

el("q").addEventListener("input", render);
el("rarity").addEventListener("change", render);
el("slot").addEventListener("change", render);
el("missingOnly").addEventListener("change", render);
el("back").addEventListener("click", showShelf);

/* pictures on or off, remembered per browser */
const ART_LS = "dex-pokecard-art";
function applyArt(on){
  document.body.classList.toggle("noimg", !on);
  try { localStorage.setItem(ART_LS, on ? "1" : "0"); } catch(e){}
}
try { if (localStorage.getItem(ART_LS) === "0") el("showArt").checked = false; } catch(e){}
applyArt(el("showArt").checked);
el("showArt").addEventListener("change", () => { applyArt(el("showArt").checked); render(); });

el("peek").addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));

el("lensX").addEventListener("click", closeLens);
el("lens").addEventListener("click", e => { if (e.target === el("lens") || e.target.tagName === "FIGURE") closeLens(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !el("lens").hidden) closeLens(); });
el("reset").addEventListener("click", () => {
  if (active === null || !Object.keys(own()).length) return;
  owned[S().key] = {};
  render();
  save();
});

el("share").addEventListener("click", async () => {
  const url = remoteDoc && backend === "firebase"
    ? syncUrl()
    : location.origin + location.pathname + (encodeAll() ? "#c=" + encodeAll() : "");
  const btn = el("share"), was = btn.textContent;
  try {
    await navigator.clipboard.writeText(url);
    btn.textContent = "Link copied — open it on your other device";
  } catch(e){
    const box = el("linkbox");
    box.hidden = false; box.value = url; box.focus(); box.select();
    btn.textContent = "Copy the link below";
  }
  btn.classList.add("ok");
  setTimeout(() => { btn.textContent = was; btn.classList.remove("ok"); }, 3200);
});

/* ---------- boot ---------- */
(function boot(){
  const m = location.hash.match(/c=([0-9a-z.\-]+)/i);
  const fromLink = m ? decodeAll(m[1]) : null;

  if (fromLink){
    owned = cleanOwned(fromLink);
    localSave();
  } else {
    try { owned = cleanOwned(JSON.parse(localStorage.getItem(LS) || "{}")); } catch(e){ owned = cleanOwned({}); }
  }

  buildShelf();
  status("warn", "loading…");
  armWatchdog();
  connect();
})();
</script>
