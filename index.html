<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Track which Pokémon TCG cards you own across sets.">
<meta name="theme-color" content="#07080b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='19' fill='%230b0d13'/%3E%3Cpath d='M20 1a19 19 0 0 1 19 19H1A19 19 0 0 1 20 1z' fill='%23f0334b'/%3E%3Ccircle cx='20' cy='20' r='6' fill='%230b0d13'/%3E%3Ccircle cx='20' cy='20' r='2.4' fill='%23cfd6e6'/%3E%3C/svg%3E">
<title>Dex's Pokecard Dex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
:root{
  --void:#07080b;--panel:#101219;--panel-2:#161923;--line:#212533;--line-soft:#1a1d27;
  --ink:#e9ebf2;--muted:#7e8598;--dim:#5b6274;--crimson:#f0334b;--jade:#35c88b;--gold:#e3b341;
  --plume:#cfd6e6;--r:10px;
  color-scheme:dark;
}
*{box-sizing:border-box}
img{max-width:100%}
[hidden]{display:none!important}
body{
  margin:0;
  background:
    radial-gradient(1100px 620px at 78% -8%, #16111c 0%, rgba(22,17,28,0) 62%),
    radial-gradient(760px 420px at 6% 4%, #0c1019 0%, rgba(12,16,25,0) 58%),
    var(--void);
  background-attachment:fixed;color:var(--ink);
  font-family:"Archivo","Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1120px;margin:0 auto;padding-inline:20px;padding-block:26px 72px}

/* masthead */
.mast{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:13px;min-width:0}
.orb{width:38px;height:38px;flex:0 0 auto}
h1{font-family:"Chakra Petch",sans-serif;font-weight:700;font-size:clamp(25px,4.4vw,36px);line-height:1;margin:0;letter-spacing:-.015em;text-wrap:balance}
h1 .apo{color:var(--crimson)}
.tagline{margin:7px 0 0;color:var(--muted);font-size:13px;letter-spacing:.02em}
.saved{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);display:flex;align-items:center;gap:7px;padding-bottom:4px}
.saved .dot{width:6px;height:6px;border-radius:50%;background:var(--dim);transition:background .25s}
.saved.on .dot{background:var(--jade);box-shadow:0 0 9px rgba(53,200,139,.75)}
.saved.warn .dot{background:var(--gold)}

/* ---------- shelf of set tiles ---------- */
.shelfhead{display:flex;align-items:baseline;gap:14px;margin:34px 0 14px}
.shelfhead h2{font-family:"Chakra Petch",sans-serif;font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--plume);margin:0}
.shelfhead .rule{flex:1;height:1px;background:var(--line)}
.shelfhead .tot{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}

.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}

.tile{
  position:relative;overflow:hidden;text-align:left;cursor:pointer;font:inherit;color:inherit;
  background:
    radial-gradient(420px 200px at 108% -30%, color-mix(in srgb, var(--ac) 22%, transparent) 0%, rgba(0,0,0,0) 70%),
    linear-gradient(180deg,var(--panel) 0%,var(--panel-2) 100%);
  border:1px solid var(--line);border-radius:16px;padding:20px 20px 18px;
  display:grid;grid-template-columns:1fr auto;gap:16px;align-items:start;
  transition:border-color .18s,transform .1s,box-shadow .18s;
}
.tile::before{
  content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--ac);opacity:.85;
}
.tile:hover{border-color:color-mix(in srgb, var(--ac) 45%, var(--line));box-shadow:0 0 0 1px color-mix(in srgb, var(--ac) 18%, transparent),0 14px 34px -22px var(--ac)}
.tile:active{transform:scale(.995)}
.tile .code{
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ac);margin-bottom:8px;display:block;
}
.tile h3{font-family:"Chakra Petch",sans-serif;font-weight:700;font-size:21px;margin:0;letter-spacing:-.005em;line-height:1.1}
.tile .series{color:var(--muted);font-size:13px;margin:5px 0 0}
.tile .meta{
  font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--dim);margin-top:13px;
  display:flex;gap:12px;flex-wrap:wrap;font-variant-numeric:tabular-nums;
}
.tile .go{
  grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin-top:15px;padding-top:13px;border-top:1px solid var(--line-soft);
}
.tile .status{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.tile .status b{color:var(--plume);font-weight:600}
.tile .arrow{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ac);white-space:nowrap}

.ring{width:66px;height:66px;flex:0 0 auto;position:relative;display:grid;place-items:center}
.ring .track{
  position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(var(--ac) calc(var(--p) * 1%), #191d28 0);
  -webkit-mask:radial-gradient(circle, transparent 25px, #000 26px);
  mask:radial-gradient(circle, transparent 25px, #000 26px);
}
.ring .pct{font-family:"Chakra Petch",sans-serif;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;position:relative}
.ring .pct em{font-style:normal;font-size:9px;color:var(--dim);margin-left:1px}

/* ---------- detail view ---------- */
.back{
  display:inline-flex;align-items:center;gap:8px;background:none;border:1px solid var(--line);
  border-radius:999px;color:var(--muted);font-family:"IBM Plex Mono",monospace;font-size:11px;
  letter-spacing:.08em;text-transform:uppercase;padding:7px 14px;cursor:pointer;margin:30px 0 16px;
}
.back:hover{color:var(--plume);border-color:#39405280}

.setbar{
  background:
    radial-gradient(520px 220px at 104% -40%, color-mix(in srgb, var(--ac) 18%, transparent) 0%, rgba(0,0,0,0) 70%),
    linear-gradient(180deg,var(--panel) 0%,var(--panel-2) 100%);
  border:1px solid var(--line);border-radius:16px;padding:22px;
  display:grid;grid-template-columns:1fr auto;gap:22px;align-items:center;
  border-top:2px solid var(--ac);
}
.setmeta h2{font-family:"Chakra Petch",sans-serif;font-weight:700;font-size:22px;margin:0;letter-spacing:.01em}
.setmeta .sub{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted);margin-top:6px;display:flex;gap:14px;flex-wrap:wrap}
.setmeta .sub span{white-space:nowrap}
.counter{text-align:right}
.counter .big{font-family:"Chakra Petch",sans-serif;font-weight:700;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.counter .big em{font-style:normal;color:var(--dim);font-size:19px}
.counter .lab{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.meter{grid-column:1/-1;height:5px;border-radius:3px;background:#0b0d13;overflow:hidden;border:1px solid var(--line-soft)}
.meter i{display:block;height:100%;width:0;background:var(--ac);transition:width .35s ease}
.splits{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.split{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 11px;background:#0c0e15;font-variant-numeric:tabular-nums}
.split b{color:var(--plume);font-weight:600}

/* toolbar */
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:20px 0 16px}
.search{position:relative;flex:1 1 240px;min-width:0}
.search input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);color:var(--ink);font-family:inherit;font-size:14px;padding:9px 12px 9px 34px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--dim)}
.search input::placeholder{color:var(--dim)}
select{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);color:var(--ink);font-family:inherit;font-size:13.5px;padding:9px 11px;cursor:pointer}
.toggle{display:inline-flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:9px 13px;cursor:pointer;font-size:13.5px;color:var(--muted);user-select:none}
.toggle input{accent-color:var(--ac);margin:0;width:14px;height:14px}
.toggle:has(input:checked){color:var(--ink);border-color:color-mix(in srgb, var(--ac) 35%, var(--line))}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}

/* card grid */
.group{margin-top:26px}
.grouphead{display:flex;align-items:baseline;gap:12px;margin-bottom:12px}
.grouphead h3{font-family:"Chakra Petch",sans-serif;font-size:13px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--plume);margin:0}
.grouphead .rule{flex:1;height:1px;background:var(--line)}
.grouphead .cnt{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:8px}
.card{
  display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:11px;width:100%;text-align:left;cursor:pointer;
  background:var(--panel);border:1px solid var(--line-soft);border-left:3px solid var(--type,#2a2f3d);
  border-radius:var(--r);padding:9px 11px 9px 12px;color:inherit;font:inherit;
  transition:border-color .16s,background .16s,transform .08s;
}
.card:hover{background:var(--panel-2);border-color:var(--line)}
.card:active{transform:scale(.993)}
.num{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums;width:30px;flex:0 0 auto}
.body{min-width:0}
.name{font-size:14.5px;font-weight:500;line-height:1.25;overflow-wrap:anywhere}
.rar{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.06em;color:var(--muted);margin-top:3px;display:block}
.rar.hi{color:var(--gold)}
.tick{width:22px;height:22px;border-radius:6px;border:1.5px solid #2c3141;flex:0 0 auto;display:grid;place-items:center;background:#0b0d13;transition:all .16s}
.tick svg{width:13px;height:13px;opacity:0;transform:scale(.5);transition:all .18s;color:#04140d}
.card.got{background:#0d1712;border-color:#1e4634;border-left-color:var(--jade)}
.card.got:hover{background:#0f1c16}
.card.got .name{color:#d8f5e8}
.card.got .tick{background:var(--jade);border-color:var(--jade);box-shadow:0 0 12px rgba(53,200,139,.35)}
.card.got .tick svg{opacity:1;transform:scale(1)}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:34px;text-align:center;color:var(--muted);font-size:14px}

footer{margin-top:44px;padding-top:18px;border-top:1px solid var(--line-soft);display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--dim);letter-spacing:.04em}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.reset{background:none;border:1px solid var(--line);border-radius:7px;color:var(--muted);font-family:inherit;font-size:11px;letter-spacing:.06em;padding:5px 11px;cursor:pointer}
.reset:hover{color:var(--crimson);border-color:#3a2030}
.act:hover{color:var(--jade);border-color:#1e4634}
.act.ok{color:#04140d;background:var(--jade);border-color:var(--jade)}
.linkbox{flex:1 1 100%;margin-top:10px;background:var(--panel);border:1px solid var(--line);border-radius:7px;color:var(--plume);font-family:inherit;font-size:11px;padding:8px 10px}

@media (max-width:560px){
  .setbar{grid-template-columns:1fr}
  .counter{text-align:left}
  .grid{grid-template-columns:1fr}
  .tile{grid-template-columns:1fr}
  .ring{margin-top:4px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

  <div id="setView" hidden>

    <section class="setbar" id="setbar">

      <div class="counter">

    <div class="tools">

          <circle cx="7" cy="7" r="4.6"/><path d="M10.4 10.4 14 14"/>
        </svg>
        <input id="q" type="search" placeholder="Search a card by name or number" aria-label="Search cards">
      </label>
      <select id="rarity" aria-label="Filter by rarity"><option value="">All rarities</option></select>
      <label class="toggle"><input type="checkbox" id="missingOnly"> Only what I&#39;m missing</label>
    </div>

    <div id="list"></div>
  </div>

  <footer>
    <span id="foot">Card data: Pok&#233;mon TCG API</span>
    <span class="acts">
      <button class="reset act" id="share" type="button">Copy link with my ticks</button>
      <button class="reset" id="reset" type="button" hidden>Clear this set</button>
    </span>
    <input class="linkbox" id="linkbox" type="text" readonly hidden aria-label="Link with your ticks">
  </footer>
</div>

/* ---------- share code ---------- */
function encodeSet(s){
  const map = owned[s.key] || {};
  let v = 0n;
  for (const k in map) if (map[k]) v |= 1n << BigInt(Number(k) - 1);
  return v ? v.toString(36) : "0";
}
function decodeSet(code, total){
  let v = 0n;
  for (const ch of String(code).toLowerCase()){
    const d = D36.indexOf(ch);
    if (d < 0) return null;
    v = v * 36n + BigInt(d);
  }
  const out = {};
  for (let i = 0; i < total; i++) if ((v >> BigInt(i)) & 1n) out[i + 1] = true;
  return out;
}
function encodeAll(){
  const parts = SETS.map(encodeSet);
  return parts.every(p => p === "0") ? "" : parts.join("-");
}
function decodeAll(code){
  const parts = String(code).split("-");
  const out = {};
  let any = false;
  SETS.forEach((s, i) => {
    const m = parts[i] != null ? decodeSet(parts[i], s.total) : null;
    if (m){ out[s.key] = m; if (Object.keys(m).length) any = true; }
  });
  return any ? out : null;
}

      '</div>' +
      '<div class="ring"><span class="track"></span><span class="pct"><span class="v"></span><em>%</em></span></div>' +
      '<div class="go"><span class="status"><b></b> <span class="of"></span></span><span class="arrow">Open &#8594;</span></div>';
    t.querySelector(".code").textContent = s.code;
    t.querySelector("h3").textContent = s.tab;
    t.querySelector(".series").textContent = s.name.split(" — ")[0];
    [s.total + " cards", s.printed + " numbered", s.released].forEach(txt => {
      const x = document.createElement("span"); x.textContent = txt;
      t.querySelector(".meta").append(x);
    });
    t.querySelector(".ring").style.setProperty("--p", pct);
    t.querySelector(".ring .v").textContent = pct;
    t.querySelector(".status b").textContent = got + " / " + s.total;
    t.querySelector(".status .of").textContent = got === s.total ? "complete" : (s.total - got) + " to go";
    t.setAttribute("aria-label", s.tab + ", " + got + " of " + s.total + " collected");
    t.addEventListener("click", () => openSet(i));
    shelf.append(t);
  });

  const got = SETS.reduce((a, s) => a + countOf(s), 0);
  const tot = SETS.reduce((a, s) => a + s.total, 0);
  el("grandTotal").textContent = got + " of " + tot + " cards collected";
}

/* ---------- one set ---------- */
function openSet(i){
  active = i;
  const s = S();
  el("shelfView").hidden = true;
  el("setView").hidden = false;
  el("reset").hidden = false;
  el("setView").style.setProperty("--ac", s.accent);
  el("setbar").style.setProperty("--ac", s.accent);
  el("q").value = "";
  el("missingOnly").checked = false;

  el("setName").textContent = s.name;
  const sub = el("setSub");
  sub.textContent = "";
  [s.code, s.total + " cards"]
    .concat(s.printed === s.total ? [] : [s.printed + " in the numbered set"])
    .concat(["released " + s.released])
    .forEach(t => { const x = document.createElement("span"); x.textContent = t; sub.append(x); });
  el("ownedT").textContent = "/" + s.total;
  el("foot").textContent = "Card data: " + s.name;

  const sel = el("rarity");
  sel.textContent = "";
  const all = document.createElement("option");
  all.value = ""; all.textContent = "All rarities";
  sel.append(all);
  const tally = {};
  s.list.forEach(c => tally[c.rarity] = (tally[c.rarity] || 0) + 1);
  Object.keys(tally).sort((a, b) => tally[b] - tally[a]).forEach(r => {
    const o = document.createElement("option");
    o.value = r; o.textContent = r;
    sel.append(o);
  });

  render();
  window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
}

function showShelf(){
  active = null;
  el("setView").hidden = true;
  el("shelfView").hidden = false;
  el("reset").hidden = true;
  el("foot").textContent = "Card data: Pokémon TCG API";
  buildShelf();
  window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
}

function cardNode(c){
  const map = own();
  const b = document.createElement("button");
  b.type = "button";
  b.className = "card" + (map[c.n] ? " got" : "");
  b.style.setProperty("--type", TYPE_COLOR[c.kind] || "#2a2f3d");
  b.dataset.n = c.n;
  b.setAttribute("aria-pressed", map[c.n] ? "true" : "false");
  b.innerHTML =
    '<span class="num">' + pad(c.n) + '</span>' +
    '<span class="body"><span class="name"></span>' +
      '<span class="rar' + (HI.has(c.rarity) ? " hi" : "") + '"></span></span>' +
    '<span class="tick"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.6" ' +
      'stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.4 6.3 11.7 13 5"/></svg></span>';
  b.querySelector(".name").textContent = c.name;
  b.querySelector(".rar").textContent = c.rarity + (c.kind && c.supertype !== "Pokémon" ? " · " + c.kind : "");
  b.addEventListener("click", () => toggle(c.n));
  return b;
}

function render(){
  if (active === null) return;
  const s = S(), map = own(), L = el("list");
  const q = el("q").value.trim().toLowerCase();
  const rar = el("rarity").value;
  const missing = el("missingOnly").checked;

  const shown = s.list.filter(c =>
    (!q || c.name.toLowerCase().includes(q) || String(c.n) === q) &&
    (!rar || c.rarity === rar) &&
    (!missing || !map[c.n]));

  L.textContent = "";
  if (!shown.length){
    const e = document.createElement("div");
    e.className = "empty";
    e.textContent = missing ? "Nothing missing here — that’s the whole filter, collected." : "No card matches that.";
    L.append(e);
  } else {
    [
      [s.printed === s.total ? "The full set" : "The numbered set", pad(1) + "–" + pad(s.printed), shown.filter(c => c.n <= s.printed)],
      ["Secret rares", pad(s.printed + 1) + "–" + pad(s.total), shown.filter(c => c.n > s.printed)]
    ].forEach(([title, range, items]) => {
      if (!items.length) return;
      const sec = document.createElement("section");
      sec.className = "group";
      const head = document.createElement("div");
      head.className = "grouphead";
      head.innerHTML = '<h3></h3><span class="rule"></span><span class="cnt"></span>';
      head.querySelector("h3").textContent = title;
      head.querySelector(".cnt").dataset.range = range;
      const grid = document.createElement("div");
      grid.className = "grid";
      items.forEach(c => grid.append(cardNode(c)));
      sec.append(head, grid);
      L.append(sec);
    });
  }
  stats();
}

function stats(){
  if (active === null) return;
  const s = S(), map = own(), L = el("list");

  L.querySelectorAll(".group").forEach(sec => {
    const cnt = sec.querySelector(".cnt");
    cnt.textContent = sec.querySelectorAll(".card.got").length + " / " +
      sec.querySelectorAll(".card").length + "  ·  " + cnt.dataset.range;
  });

  const n = s.list.filter(c => map[c.n]).length;
  el("ownedN").textContent = n;
  el("meterFill").style.width = (n / s.total * 100) + "%";

  const main = s.list.filter(c => c.n <= s.printed), secret = s.list.filter(c => c.n > s.printed);
  const parts = [];
  if (secret.length){
    parts.push(["Numbered set", main.filter(c => map[c.n]).length, main.length]);
    parts.push(["Secret rares", secret.filter(c => map[c.n]).length, secret.length]);
  }
  CHIP_RARITIES.forEach(r => {
    const g = s.list.filter(c => c.rarity === r);
    if (g.length) parts.push([r, g.filter(c => map[c.n]).length, g.length]);
  });

  const box = el("splits");
  box.textContent = "";
  parts.forEach(([label, got, tot]) => {
    const d = document.createElement("span");
    d.className = "split";
    d.innerHTML = '<b></b> <span></span>';
    d.querySelector("b").textContent = got + "/" + tot;
    d.querySelector("span").textContent = label;
    box.append(d);
  });
}

/* ---------- state ---------- */
function toggle(n){
  const map = own();
  if (map[n]) delete map[n]; else map[n] = true;
  const node = el("list").querySelector('.card[data-n="' + n + '"]');
  if (node){
    node.classList.toggle("got", !!map[n]);
    node.setAttribute("aria-pressed", map[n] ? "true" : "false");
    if (el("missingOnly").checked && map[n]) { render(); save(); return; }
  }
  stats();
  save();
}

function status(state, text){
  el("saved").className = "saved" + (state ? " " + state : "");
  el("savedText").textContent = text;
}

const grandTotal = () => SETS.reduce((a, s) => a + countOf(s), 0);

function save(){
  try { localStorage.setItem(LS, JSON.stringify(owned)); } catch(e){}
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    const code = encodeAll();
    try { history.replaceState(null, "", code ? "#c=" + code : location.pathname + location.search); } catch(e){}
  }, 300);
  const n = grandTotal();
  status(n ? "on" : "warn", n ? "saved in this browser" : "nothing ticked yet");
}

el("q").addEventListener("input", render);
el("rarity").addEventListener("change", render);
el("missingOnly").addEventListener("change", render);
el("back").addEventListener("click", showShelf);
el("reset").addEventListener("click", () => {
  if (active === null || !Object.keys(own()).length) return;
  owned[S().key] = {};
  render();
  save();
});

el("share").addEventListener("click", async () => {
  const code = encodeAll();
  const url = location.origin + location.pathname + (code ? "#c=" + code : "");
  const btn = el("share"), was = btn.textContent;
  try {
    await navigator.clipboard.writeText(url);
    btn.textContent = "Link copied — open it on your other device";
  } catch(e){
    const box = el("linkbox");
    box.hidden = false; box.value = url; box.focus(); box.select();
    btn.textContent = "Copy the link below";
  }
  btn.classList.add("ok");
  setTimeout(() => { btn.textContent = was; btn.classList.remove("ok"); }, 3200);
});

/* ---------- boot ---------- */
(function boot(){
  const m = location.hash.match(/c=([0-9a-z-]+)/i);
  const fromLink = m ? decodeAll(m[1]) : null;

  if (fromLink){
    owned = fromLink;
    try { localStorage.setItem(LS, JSON.stringify(owned)); } catch(e){}
  } else {
    try { owned = JSON.parse(localStorage.getItem(LS) || "{}") || {}; } catch(e){ owned = {}; }
  }
  SETS.forEach(s => { owned[s.key] = owned[s.key] || {}; });

  buildShelf();
  const n = grandTotal();
  if (fromLink){
    status("on", "loaded from your link");
  } else {
    if (n) save();
    status(n ? "on" : "warn", n ? "saved in this browser" : "nothing ticked yet");
  }
})();
</script>

</body>
